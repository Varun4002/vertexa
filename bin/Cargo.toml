[package]
name = "vertexa-bin"
edition.workspace = true
version.workspace = true

[[bin]]
name = "vertexa"
path = "vertexa.rs"

[[bin]]
name = "backtester"
path = "backtester.rs"

[[bin]]
name = "backtest_historical"
path = "backtest_historical.rs"

[dependencies]
vertexa-core = { path = "../crates/core" }
vertexa-ingestion = { path = "../crates/ingestion" }
vertexa-signals = { path = "../crates/signals" }
vertexa-consensus = { path = "../crates/consensus" }
vertexa-mev-guard = { path = "../crates/mev_guard" }
vertexa-risk = { path = "../crates/risk" }
vertexa-executor = { path = "../crates/executor" }
vertexa-notify = { path = "../crates/notify" }
vertexa-rag = { path = "../crates/rag_pipeline" }
alloy.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
config.workspace = true
eyre.workspace = true
dotenvy.workspace = true
chrono.workspace = true
serde_json.workspace = true
csv = "1.3"
clap = { version = "4", features = ["derive"] }
